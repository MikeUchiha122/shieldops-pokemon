[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "shieldops-pokemon"
version = "1.0.0"
description = "Pokémon Competitive Strategy & Training Architect — Secure Edition 2026"
authors = ["Mike <MikeUchiha122@github>"]
readme = "README.md"
python = "^3.12"   # Usar 3.14 cuando esté disponible en stable; compatible desde 3.12

[tool.poetry.dependencies]
python          = "^3.12"
pydantic        = "^2.7"
pydantic-settings = "^2.3"
sqlalchemy      = "^2.0"
alembic         = "^1.13"
aiosqlite       = "^0.20"
httpx           = "^0.27"
beautifulsoup4  = "^4.12"
lxml            = "^5.2"
chromadb        = "^0.5"
sentence-transformers = "^3.0"
python-dotenv   = "^1.0"
rich            = "^13.7"
typer           = "^0.12"
aiohttp         = "^3.9"
tenacity        = "^8.3"     # retry seguro para scrapers

[tool.poetry.group.dev.dependencies]
pytest          = "^8.2"
pytest-asyncio  = "^0.23"
pytest-cov      = "^5.0"
bandit          = {extras = ["toml"], version = "^1.7"}
semgrep         = "^1.72"
pip-audit       = "^2.7"
ruff            = "^0.4"
mypy            = "^1.10"
pre-commit      = "^3.7"

# ─── SAST / Security ───────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips        = []
severity     = "medium"    # falla en medium+

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# ─── Linter / Formatter ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length    = 100
select         = ["E", "F", "W", "C90", "I", "N", "S", "B", "A", "UP"]
# S = flake8-bandit rules embebidos en ruff
ignore         = ["S101"]   # allow assert in tests

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "N"]

# ─── Type checking ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true

# ─── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "--cov=core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["tests/*", ".venv/*", "scripts/*"]
